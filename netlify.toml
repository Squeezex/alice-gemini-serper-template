[build]
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/alice"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/alice"
  status = 200
